services:
  ps5-tracker:
    build: .
    restart: unless-stopped
    environment:
      # Every 10 minutes. Cheap: alerts fire on transitions only, so a
      # tighter interval costs requests, not notifications.
      CHECK_INTERVAL_SECONDS: 600
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_TO: ${EMAIL_TO}
      # Proof-of-life summary when nothing has been worth alerting on (12h).
      HEARTBEAT_SECONDS: 43200
      # Optional residential proxy. Without one, Flipkart / Sony Center /
      # Croma block this server's IP outright — see README "IP blocking".
      # Format: http://user:pass@host:port
      PROXY_URL: ${PROXY_URL:-}
    volumes:
      # Keeps state.json across redeploys, so you are not re-alerted on restart.
      - ps5-data:/data
      # Edit product URLs without rebuilding the image.
      - ./config.json:/app/config.json:ro

    # This is a worker with no HTTP server, so there is nothing to expose and no
    # domain to attach. Declaring this check explicitly stops an orchestrator
    # from probing for an open port, finding none, and restart-looping the
    # container. Health here means "a check pass ran recently".
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 5m
      timeout: 30s
      retries: 3
      # Long enough for image start plus the first full pass (browser included).
      start_period: 5m

volumes:
  ps5-data:

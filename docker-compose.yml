services:
  ps5-tracker:
    build: .
    restart: unless-stopped
    environment:
      # Every 10 minutes. Cheap: alerts fire on transitions only, so a
      # tighter interval costs requests, not notifications.
      CHECK_INTERVAL_SECONDS: 600
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_TO: ${EMAIL_TO}
      # Proof-of-life summary when nothing has been worth alerting on (12h).
      HEARTBEAT_SECONDS: 43200
    volumes:
      # Keeps state.json across redeploys, so you are not re-alerted on restart.
      - ps5-data:/data
      # Edit product URLs without rebuilding the image.
      - ./config.json:/app/config.json:ro

volumes:
  ps5-data:
